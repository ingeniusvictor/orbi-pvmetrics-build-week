name: PVMetrics Product Evolution CI

on:
  pull_request:
    branches:
      - feature/pvmetrics-product-evolution
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvmetrics-product-evolution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Test
        run: npm test

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build