name: PVMetrics Product Evolution CI

on:
  pull_request:
    branches:
      - feature/pvmetrics-product-evolution
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvmetrics-product-evolution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Test
        run: npm test

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
