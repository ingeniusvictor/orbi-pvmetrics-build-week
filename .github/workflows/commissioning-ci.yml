name: Commissioning CI

on:
  push:
    branches:
      - feature/bess-commissioning-workspace
  pull_request:
    branches:
      - master
      - competition/ai-climate-recovery-2026

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: TypeScript lint
        run: npm run lint

      - name: Production build
        run: npm run build
